<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Cancelled — Academica</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .status-page {
      position: relative; z-index: 1;
      min-height: 80vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 3rem 1.5rem;
    }
    .status-icon {
      width: 80px; height: 80px; border-radius: 50%;
      background: rgba(107,107,107,0.1); border: 1.5px solid rgba(107,107,107,0.3);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; margin: 0 auto 2rem;
      animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
    .status-page h1 {
      font-family: var(--ff-serif); font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300; letter-spacing: -0.02em; margin-bottom: 1rem;
    }
    .status-page p { color: var(--text2); max-width: 42ch; line-height: 1.7; margin-bottom: 0.75rem; }
    .btn-row { display: flex; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; justify-content: center; }
    .btn-primary {
      font-family: var(--ff-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.7rem 1.5rem; border-radius: var(--radius);
      background: var(--accent); border: none; color: var(--bg);
      text-decoration: none; transition: all 0.25s; display: inline-block;
    }
    .btn-primary:hover { background: #dbbe82; }
    .btn-secondary {
      font-family: var(--ff-mono); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase;
      padding: 0.7rem 1.5rem; border-radius: var(--radius);
      border: 1px solid var(--border2); background: transparent; color: var(--text);
      text-decoration: none; transition: all 0.25s; display: inline-block;
    }
    .btn-secondary:hover { border-color: var(--text2); }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">
    <span class="nav-logo-mark">Academica</span>
    <span class="nav-logo-text">Learning Institute</span>
  </a>
</nav>

<div class="status-page">
  <div class="status-icon">×</div>
  <h1>No worries.</h1>
  <p>Your checkout was cancelled — no charge was made. The course will be here whenever you're ready.</p>
  <p style="font-size: 0.8rem; color: var(--text3)">Questions? Drop us a line at support@academica.io</p>
  <div class="btn-row">
    <a href="/" class="btn-primary">Return to Courses</a>
    <a href="javascript:history.back()" class="btn-secondary">Try Again</a>
  </div>
</div>
</body>
</html>
